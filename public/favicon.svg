<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <!-- Letter J Gradient -->
    <linearGradient id="jGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <!-- Letter Y Gradient -->
    <linearGradient id="yGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle Inner Grid / Tech Accent -->
  <circle cx="51" cy="13" r="3" fill="#10b981" />
  <circle cx="51" cy="13" r="3" fill="#10b981" filter="url(#cyanGlow)" opacity="0.8" />

  <!-- Monogram JY -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="27" letter-spacing="-1">
    <!-- J -->
    <text x="11" y="44" fill="url(#jGrad)" filter="url(#cyanGlow)">J</text>
    <!-- Y -->
    <text x="27" y="44" fill="url(#yGrad)">Y</text>
  </g>

  <!-- Code bracket accent </> subtle at bottom right -->
  <path d="M 46 45 L 43 41 L 46 37" fill="none" stroke="#00f2fe" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
  <path d="M 50 37 L 53 41 L 50 45" fill="none" stroke="#00f2fe" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
</svg>